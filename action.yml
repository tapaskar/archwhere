name: archwhere
description: "Know where your AI agents’ PRs land — comments each PR with the architecture components touched, on a highlighted system map."
branding:
  icon: map
  color: orange
inputs:
  base:
    description: Base ref to diff against (defaults to the PR base branch)
    required: false
  model:
    description: Path to architecture.json (defaults to arch/architecture.json)
    required: false
  enforce:
    description: "Fail the PR when the map is stale, the PR weakens it, or it changes a security zone without the owner-review label. Run it on labeled and unlabeled events too."
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Map changed components
      shell: bash
      run: |
        BASE="${{ inputs.base }}"; [ -z "$BASE" ] && BASE="origin/${{ github.base_ref }}"
        MODEL_ARG=""; [ -n "${{ inputs.model }}" ] && MODEL_ARG="--arch ${{ inputs.model }}"
        node "${{ github.action_path }}/bin/archwhere.js" map --base "$BASE" --format md $MODEL_ARG > /tmp/archwhere-comment.md
    - name: Upsert the PR comment
      if: always()
      continue-on-error: true
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const body = fs.readFileSync('/tmp/archwhere-comment.md', 'utf8');
          const { data: comments } = await github.rest.issues.listComments({
            ...context.repo, issue_number: context.issue.number, per_page: 100
          });
          const mine = comments.find(c => c.body && c.body.startsWith('<!-- archwhere -->'));
          if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
          else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
    - name: Enforce the map
      if: always() && inputs.enforce == 'true'
      shell: bash
      env:
        ARCHWHERE_PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        BASE: ${{ inputs.base || format('origin/{0}', github.base_ref) }}
        MODEL: ${{ inputs.model }}
      run: node "${{ github.action_path }}/bin/archwhere.js" check --base "$BASE" ${MODEL:+--arch "$MODEL"}
