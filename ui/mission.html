<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>archwhere — mission control</title>
<style>
  * { box-sizing:border-box; margin:0; }
  body { font-family: system-ui, -apple-system, sans-serif; background:#F4F4F1; color:#1F2433; }
  header { background:#1F2433; color:#FFF7EE; padding:12px 20px; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  header h1 { font-size:16px; font-weight:600; display:flex; align-items:baseline; gap:9px; }
  /* The wordmark is a sibling of #htitle, never inside it: init() overwrites #htitle's text. */
  header h1 .brand { font-size:10.5px; font-weight:600; letter-spacing:.07em; color:#1F2433;
    background:#FFF7EE; border-radius:999px; padding:2px 8px; text-decoration:none; white-space:nowrap; }
  header h1 .brand:hover { background:#FFF; }
  #meta { color:#C0BCBA; font-size:12px; }
  .lens { display:flex; gap:4px; background:#2F3341; border-radius:10px; padding:4px; }
  .lens button { font-size:12.5px; padding:5px 13px; border-radius:7px; color:#C0BCBA; background:none; border:0; cursor:pointer; }
  .lens button.on { background:#F7B32B; color:#1F2433; font-weight:700; }
  .wrap { display:flex; gap:14px; padding:14px 20px; align-items:flex-start; }
  /* System flow and the Record are reference, consulted rarely and expensive to draw: drawers,
     loaded on open, not tabs that replace the map. */
  .drawer { border-top:1px solid #E3E3DE; margin-top:14px; padding-top:10px; }
  .drawer summary { cursor:pointer; font-size:12.5px; font-weight:600; color:#1F2433; }
  .drawer summary:focus-visible { outline:2px solid #1F6F6B; outline-offset:2px; }
  .drawer #systemflow, .drawer #recordview { display:block; margin-top:10px; }
  /* rail */
  #rail { width:330px; flex-shrink:0; background:#fff; border:1px solid #DDD; border-radius:12px; padding:12px; max-height:calc(100vh - 100px); overflow:auto; }
  #rail h2 { font-size:12px; letter-spacing:1px; color:#8A8A8A; margin-bottom:8px; }
  .sect { font-size:10.5px; font-weight:800; letter-spacing:1px; margin:10px 0 6px; }
  .item { border:1.4px solid #E3E3DE; border-left-width:5px; border-radius:9px; padding:8px 10px; font-size:12px; line-height:1.4; background:#FBFBF9; margin-bottom:8px; cursor:pointer; }
  .item:hover { border-color:#1F2433; } .item.sel { box-shadow:0 0 0 3px #F7B32B; }
  .meta { display:flex; gap:6px; margin-top:5px; align-items:center; flex-wrap:wrap; }
  .comp { font-size:10px; border-radius:7px; padding:1px 7px; color:#fff; background:#595959; }
  .num { color:#2F4AC0; font-weight:600; font-size:11px; } .cc { font-size:10.5px; color:#6b7180; }
  .mbtn { background:#0F7A5C; color:#fff; font-size:11px; border-radius:7px; padding:3px 10px; font-weight:700; border:0; cursor:pointer; }
  .mbtn.confirm, .mbtn.zoned { background:#C2410C; }
  .why { margin-top:5px; font-size:10.5px; line-height:1.4; color:#595f6e; }
  .why .over { color:#8a6d3b; } .why .age { color:#8A8A8A; }
  .refused { font-size:11px; font-weight:600; color:#B42318; margin-top:4px; }
  .refused:empty { display:none; }
  .hidden-prs { font-size:11px; color:#8a6d3b; background:#FDF6E8; border-radius:7px; padding:6px 8px; margin-bottom:8px; }
  /* map */
  #map { flex:1; background:#fff; border:1px solid #DDD; border-radius:12px; padding:18px 18px 10px; overflow:auto; }
  .lane { border:1.5px dashed #C9C9C4; border-radius:10px; position:relative; margin:14px 0 26px; padding:22px 14px 18px; display:flex; gap:14px; flex-wrap:wrap; }
  .lane > b { position:absolute; top:-9px; left:14px; background:#fff; padding:0 8px; font-size:10.5px; color:#8A8A8A; letter-spacing:1px; }
  .node { position:relative; width:172px; min-height:64px; border-radius:9px; border:1.6px solid; background:#fff; padding:7px 10px; cursor:pointer; }
  .node .t { font-size:12.5px; font-weight:600; } .node .s { font-size:10px; color:#6b7180; display:block; }
  .node .m { font-size:10.5px; color:#595f6e; margin-top:4px; line-height:1.45; }
  .k-product { border-color:#0F7A5C; background:#EFF8F3; } .k-core { border-color:#2F4AC0; background:#EEF2FB; }
  .k-security { border-color:#C2410C; background:#FBEEE9; } .k-feature { border-color:#B45309; background:#FDF6E8; }
  .k-infra { border-color:#595959; background:#F1F1F1; } .k-ops, .k-docs { border-color:#9a9a96; background:#F7F7F5; }
  .node.sel { box-shadow:0 0 0 4px #F7B32B; }
  .badge { position:absolute; top:-10px; right:-8px; background:#1F2433; color:#fff; font-size:10px; border-radius:10px; padding:1px 7px; border:2px solid #fff; }
  .alert { position:absolute; top:-10px; left:8px; font-size:9.5px; color:#fff; font-weight:700; border-radius:8px; padding:1px 7px; border:2px solid #fff; }
  .a-security { background:#C2410C; } .a-blocked { background:#B45309; }
  body[data-metric="heat"] .node { border-color:#C9C9C4 !important; background:var(--heat, #fff) !important; }
  #heatnote { font-size:11.5px; color:#8A8A8A; margin:4px 2px 8px; display:none; }
  body[data-metric="heat"] #heatnote { display:block; }
  .h-ok { box-shadow:0 0 0 4px rgba(18,161,80,.18) !important; border-color:#12A150 !important; }
  .h-warn { box-shadow:0 0 0 4px rgba(232,162,0,.25) !important; border-color:#E8A200 !important; }
  .h-bad { box-shadow:0 0 0 5px rgba(215,38,61,.28) !important; border-color:#D7263D !important; }
  /* Not knowing has to look different from being well: dashed and dimmed, never green. */
  .h-unknown { border-style:dashed !important; border-color:#9AA0AC !important; opacity:.7; }
  #rtnote { font-size:11.5px; color:#8A8A8A; margin:4px 2px 8px; display:none; }
  body[data-metric="health"] #rtnote { display:block; }
  /* panel */
  #panel { width:420px; flex-shrink:0; background:#fff; border:1px solid #DDD; border-radius:12px; display:flex; flex-direction:column; max-height:calc(100vh - 100px); }
  .phead { padding:12px 16px; border-bottom:1px solid #EEE; }
  .phead .crumb { font-size:10.5px; color:#8A8A8A; } .phead .title { font-size:14px; font-weight:700; margin-top:2px; }
  #plist { padding:10px 16px; overflow:auto; }
  .trow { border:1.3px solid #E3E3DE; border-radius:8px; padding:7px 10px; font-size:12px; margin-bottom:7px; cursor:pointer; background:#FBFBF9; }
  .trow:hover { border-color:#1F2433; }
  #thread { padding:12px 16px; display:none; flex-direction:column; gap:10px; overflow:auto; flex:1; }
  .msg { max-width:92%; border-radius:11px; padding:8px 12px; font-size:12.5px; line-height:1.5; white-space:pre-wrap; word-break:break-word; }
  .me { align-self:flex-end; background:#E8EEF9; border:1px solid #c9d4ee; }
  .them { align-self:flex-start; background:#F6F6F3; border:1px solid #E3E3DE; }
  .who { font-size:10.5px; color:#6b7180; margin-bottom:2px; } .who b { color:#1F2433; }
  .bar { display:flex; gap:8px; padding:10px 16px; border-top:1px solid #EEE; }
  .bar textarea { flex:1; border:1.4px solid #C9C9C4; border-radius:8px; padding:8px 10px; font:inherit; font-size:12.5px; resize:vertical; min-height:38px; }
  .bar select { border:1.4px solid #C9C9C4; border-radius:8px; padding:0 6px; font:inherit; font-size:12px; background:#fff; color:#1F2433; }
  .bar .ask { display:flex; flex-direction:column; justify-content:center; gap:2px; font-size:10.5px; color:#6b7180; }
  .bar .ask select { height:28px; }
  .agent { display:inline-block; font-size:10px; font-weight:700; color:#fff; background:#7E3FA0; border-radius:7px; padding:0 6px; margin-left:4px; }
  .bar button { background:#1F2433; color:#fff; border:0; border-radius:8px; padding:0 16px; font-size:12.5px; cursor:pointer; }
  .cdet { border:1.3px solid #E3E3DE; border-radius:8px; padding:10px 12px; font-size:12px; margin-bottom:10px; background:#fff; line-height:1.45; }
  .cdet h4 { margin:8px 0 3px; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:#6b7180; }
  .cdet code { font-size:11px; background:#F3F3EF; padding:1px 4px; border-radius:4px; }
  .cdet .chip { display:inline-block; border:1px solid #D5D5CF; border-radius:10px; padding:1px 8px; margin:2px 3px 0 0; cursor:pointer; font-size:11px; }
  .cdet .chip:hover { border-color:#1F2433; }
  .cdet .st-ok { color:#1E7A46; } .cdet .st-warn { color:#A86400; } .cdet .st-bad { color:#B42318; }
  .ghost { background:none; border:0; color:#2F4AC0; font-size:11.5px; cursor:pointer; padding:0; }
  a { color:#2F4AC0; }
  #systemflow { display:none; }
  #recordview { display:none; padding:14px 18px; font-size:13px; }
  #recordview .rec { border-bottom:1px solid #E4E4DF; padding:7px 0; }
  #recordview .who { color:#6b7180; font-size:12px; }
  #systemflow h3 { font-size:13px; margin:0 0 6px; }
  #systemflow .note { font-size:12px; color:#6b7180; margin:0 0 8px; }
  #systemflow details { border:1.3px solid #E3E3DE; border-radius:8px; padding:9px 12px; margin-top:8px; font-size:13px; }
  #systemflow summary { cursor:pointer; font-weight:600; }
  #systemflow summary span { font-weight:400; color:#6b7180; font-size:12px; }
  #systemflow .dg { overflow:auto; margin-top:8px; }
  #systemflow .dg svg { max-width:100%; height:auto; }
  #systemflow pre { white-space:pre-wrap; font-size:11px; }
</style></head><body data-metric="health">
<header>
  <h1><span id="htitle">mission control</span><a class="brand" href="https://github.com/tapaskar/archwhere" target="_blank" rel="noopener noreferrer">archwhere</a></h1>
  <div class="lens" role="group" aria-label="What the cards show">
    <button data-m="health" class="on" aria-pressed="true">Health</button>
    <button data-m="heat" aria-pressed="false">Heat</button>
  </div>
  <span id="meta">loading…</span>
</header>
<div class="wrap">
  <div id="rail"><h2>NEEDS YOUR ATTENTION</h2><div id="railbody">loading…</div></div>
  <div id="map">
    <div id="rtnote"></div><div id="heatnote"></div><div id="lanes"></div>
    <details id="dflow" class="drawer"><summary>System flow</summary><div id="systemflow"></div></details>
    <details id="drecord" class="drawer"><summary>Record</summary><div id="recordview"></div></details>
  </div>
  <div id="panel">
    <div class="phead"><div class="crumb" id="pcrumb">Select a component or a rail item</div><div class="title" id="ptitle">—</div></div>
    <div id="plist"></div>
    <div id="thread"></div>
    <div class="bar" id="composer" style="display:none">
      <textarea id="cbody" placeholder=""></textarea>
      <label class="ask" id="caskwrap" style="display:none">Ask:<select id="cask" title="Which agent to summon"></select></label>
      <button id="csend">Send</button>
    </div>
  </div>
</div>
<script>
'use strict';
const $ = s => document.querySelector(s);
let MODEL = null, STATE = null, RUNTIME = null;
let sel = { component: null, thread: null, pr: null, mode: null }; // mode: 'list' | 'issue' | 'pr' | 'new'
const KINDC = { security: '#C2410C', product: '#0F7A5C', core: '#2F4AC0', feature: '#B45309', infra: '#595959', ops: '#7E3FA0', docs: '#8A8A8A' };

// Everything from GitHub or the model goes through this before innerHTML: anyone can title a PR on a public repo.
const esc = x => String(x == null ? '' : x).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

async function j(url, opts) {
  const o = opts && opts.body ? { ...opts, headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) } } : opts;
  const r = await fetch(url, o);
  const d = await r.json();
  if (!r.ok || d.error) throw Object.assign(new Error(d.error || r.status), { data: d });
  return d;
}

/** What the cards are showing: live health, or change heat. Kept on the body so CSS can read it. */
function metric() { return document.body.dataset.metric; }

document.querySelectorAll('.lens button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.lens button').forEach(x => {
    const on = x === b;
    x.classList.toggle('on', on);
    x.setAttribute('aria-pressed', String(on));
  });
  document.body.dataset.metric = b.dataset.m;
  if (b.dataset.m === 'health') refreshRuntime();
  if (b.dataset.m === 'heat') refreshHeat();
});

// Both drawers hold something costly to build, so each is fetched the first time it is opened
// and then left alone. Mermaid in particular is only loaded if the system flow is ever wanted.
$('#drecord').addEventListener('toggle', function () {
  if (!this.open || this.dataset.loaded) return;
  this.dataset.loaded = '1';
  showRecord().catch(e => { $('#recordview').textContent = 'Could not read the record: ' + e.message; });
});
$('#dflow').addEventListener('toggle', function () {
  if (!this.open || this.dataset.loaded) return;
  this.dataset.loaded = '1';
  showSystemFlow().catch(e => { $('#systemflow').textContent = 'Could not load the system flow: ' + e.message; });
});

// ---- Record lens: read-only. Record text comes from agents, so it only ever goes in as textContent.
async function showRecord() {
  const r = await j('/api/record');
  const box = $('#recordview');
  box.textContent = '';
  const line = (text, cls, tag = 'div') => { const el = document.createElement(tag); el.textContent = text; if (cls) el.className = cls; box.appendChild(el); return el; };
  line((r.ok ? '✓ the record verifies' : '✗ the record does NOT verify') + ` · ${r.count} entries · witness ${r.witness} · ${r.anchors} anchors checked`, '', 'b');
  if (!r.anchors) line('Not anchored: a full rewrite of the record would not be noticed.', 'who');
  for (const p of r.problems) line(p);
  for (const w of r.warnings) line(w, 'who');
  if (r.claims.length) line('Active claims', '', 'h3');
  for (const c of r.claims) line(`${c.task} · ${c.role} · ${c.agent} (${c.vendor})${c.branch ? ' · ' + c.branch : ''} · until ${c.expires_at}`);
  line('Latest entries', '', 'h3');
  if (!r.latest.length) line('Nothing recorded yet.', 'who');
  for (const e of r.latest) {
    const row = document.createElement('div'); row.className = 'rec'; box.appendChild(row);
    const a = document.createElement('div'); a.textContent = `${e.type}: ${e.title}`; row.appendChild(a);
    const b = document.createElement('div'); b.className = 'who';
    const signed = (e.signed_by || []).map(s => `${s.decision} signed by ${s.signer}`).join(', ');
    b.textContent = `${e.ts} · ${e.made_by} · ${e.author} / ${e.agent} / ${e.model} / ${e.vendor} · ${e.hash.slice(0, 12)}${signed ? ' · ' + signed : ''}`;
    row.appendChild(b);
  }
}

// ---- System flow lens: the Mermaid system map and every process flow, drawn in the page.
// The library is fetched only when this lens opens, pinned by hash.
const MERMAID_SRC = 'https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js';
const MERMAID_SRI = 'sha384-rbtjAdnIQE/aQJGEgXrVUlMibdfTSa4PQju4HDhN3sR2PmaKFzhEafuePsl9H/9I';
let mermaidLoad = null, flowSeq = 0, flowShown = false;
function loadMermaid() {
  if (!mermaidLoad) mermaidLoad = new Promise((ok, no) => {
    const s = document.createElement('script');
    s.src = MERMAID_SRC; s.integrity = MERMAID_SRI; s.crossOrigin = 'anonymous';
    s.onload = () => { window.mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: 'neutral', flowchart: { useMaxWidth: true } }); ok(window.mermaid); };
    s.onerror = () => no(new Error('the diagram library did not load'));
    document.head.append(s);
  });
  return mermaidLoad;
}
async function drawFlow(box, text) {
  try {
    const m = await loadMermaid();
    box.innerHTML = (await m.render('sf' + (++flowSeq), text)).svg;   // Mermaid strict mode, from our own architecture file
  } catch (e) {
    const pre = document.createElement('pre');
    pre.textContent = 'Could not draw this (' + e.message + '). Source:\n\n' + text;
    box.replaceChildren(pre);
  }
}
async function showSystemFlow() {
  if (flowShown) return;
  flowShown = true;
  const root = $('#systemflow');
  root.textContent = 'Loading…';
  let d;
  try { d = await j('/api/system-flow'); } catch (e) { flowShown = false; throw e; }
  root.textContent = '';
  const h = document.createElement('h3');
  h.textContent = 'System map';
  const note = document.createElement('p');
  note.className = 'note';
  note.textContent = d.touched ? d.touched + ' component(s) with an open PR are highlighted.' : 'No component has an open PR.';
  const sys = document.createElement('div');
  sys.className = 'dg';
  const fh = document.createElement('h3');
  fh.textContent = d.flows.length ? 'Process flows (' + d.flows.length + ')' : 'No process flows yet: add them under "flows" in architecture.json';
  fh.style.marginTop = '16px';
  root.append(h, note, sys, fh);
  for (const f of d.flows) {
    const det = document.createElement('details');
    const sum = document.createElement('summary');
    sum.textContent = f.name;
    if (f.actor) { const a = document.createElement('span'); a.textContent = ' · ' + f.actor; sum.append(a); }
    const box = document.createElement('div');
    box.className = 'dg';
    det.append(sum, box);
    // Drawn on first open: Mermaid can't measure a hidden element.
    det.addEventListener('toggle', () => { if (det.open && !box.firstChild) drawFlow(box, f.diagram); });
    root.append(det);
  }
  await drawFlow(sys, d.map);
}

function laneTitle(i) { return (MODEL.laneTitles && MODEL.laneTitles[i]) || 'LANE ' + (i + 1); }

function renderMap() {
  const box = $('#lanes'); box.innerHTML = '';
  (MODEL.lanes.length ? MODEL.lanes : [Object.keys(MODEL.components)]).forEach((lane, i) => {
    const el = document.createElement('div'); el.className = 'lane';
    el.innerHTML = '<b>' + esc(laneTitle(i)) + '</b>';
    for (const id of lane) {
      const c = MODEL.components[id]; if (!c) continue;
      const n = document.createElement('div');
      n.className = 'node k-' + c.kind; n.id = 'n-' + id;
      const prov = c.provider ? '<span class="s" style="color:#8a6d3b">' + esc(c.provider) + '</span>' : '';
      n.innerHTML = '<span class="t">' + esc(c.name) + '</span><span class="s">' + esc(c.sublabel || c.kind) + '</span>' + prov
        + '<span class="m"></span><span class="badge"></span><span class="alert"></span>';
      n.onclick = () => selectComponent(id);
      el.appendChild(n);
    }
    box.appendChild(el);
  });
}

function renderBadges() {
  if (!STATE) return;
  for (const id of Object.keys(MODEL.components)) {
    const n = $('#n-' + id); if (!n) continue;
    const b = STATE.badges[id];
    const badge = n.querySelector('.badge'), alert = n.querySelector('.alert');
    const bits = [];
    if (b && b.threads) bits.push('💬 ' + b.threads);
    if (b && b.prs.length) bits.push('PR ' + b.prs.map(x => '#' + x).join(' '));
    badge.textContent = bits.join(' · ');
    badge.style.display = bits.length ? '' : 'none';
    if (b && b.alert) { alert.textContent = b.alert; alert.className = 'alert a-' + b.alert; alert.style.display = ''; }
    else { alert.textContent = ''; alert.style.display = 'none'; }
  }
}

// Why an item sits here, and how old it is. Overlaps name the other open PRs on the same ground.
function railWhy(it) {
  const age = it.ageDays == null ? '' : 'opened ' + (it.ageDays ? it.ageDays + 'd ago' : 'today')
    + (it.idleDays == null ? '' : ' · ' + (it.idleDays ? 'idle ' + it.idleDays + 'd' : 'active today'));
  const over = (it.overlaps || []).slice(0, 3).map(o => 'overlaps PR #' + o.number
    + (o.components.length ? ' on ' + o.components.join(', ') : '') + (o.files.length ? ' (' + o.files.length + ' shared file' + (o.files.length === 1 ? '' : 's') + ')' : ''));
  return '<div class="why"><div>' + (it.reasons || []).map(esc).join(' · ') + '</div>'
    + over.map(r => '<div class="over">' + esc(r) + '</div>').join('')
    + (age ? '<div class="age">' + esc(age) + '</div>' : '') + '</div>';
}

// The server rechecks everything against GitHub at the click, pinned to the commit shown here.
async function mergeFrom(it, mb, securityReasons) {
  let confirmSecurity;
  if (securityReasons) {
    const typed = prompt('PR #' + it.number + ' needs an extra look:\n\n- ' + securityReasons.join('\n- ') + '\n\nType the PR number to merge it.');
    if (typed === null) return;
    if (typed.trim() !== String(it.number)) { mb.textContent = 'not confirmed'; return; }
    confirmSecurity = it.number;
  }
  mb.disabled = true; mb.textContent = 'rechecking…';
  try {
    await j('/api/merge', { method: 'POST', body: JSON.stringify({ number: it.number, sha: it.sha, confirmSecurity }) });
    mb.textContent = 'merged ✓';
    refreshState();
  } catch (err) {
    const d = err.data || {};
    if (d.code === 'confirm' && !securityReasons) { mb.disabled = false; return mergeFrom(it, mb, d.reasons); }
    mb.textContent = 'not merged'; mb.title = String(err.message);
    const box = mb.closest('.item').querySelector('.refused');
    box.textContent = 'Not merged: ' + err.message;
  }
}

function railItem(it, sec) {
  const d = document.createElement('div');
  d.className = 'item'; d.style.borderLeftColor = { security: '#C2410C', blocked: '#B45309', attention: '#2F4AC0', mergeable: '#0F7A5C' }[sec];
  const comps = it.components.map(c => '<span class="comp" style="background:' + (KINDC[(MODEL.components[c] || {}).kind] || '#595959') + '">' + esc(c) + '</span>').join('');
  const zoned = sec === 'security' && it.kind === 'pr' && it.canMerge;
  const merge = sec === 'mergeable' ? '<button class="mbtn" data-pr="' + esc(it.number) + '">Merge</button>'
    : zoned ? '<button class="mbtn zoned" data-pr="' + esc(it.number) + '">Merge…</button>' : '';
  d.innerHTML = esc(it.title) + '<div class="meta">' + comps + '<span class="num">' + (it.kind === 'pr' ? 'PR ' : '') + '#' + esc(it.number) + '</span>'
    + '<span class="cc">💬 ' + esc(it.comments || 0) + '</span>' + merge + '</div>' + railWhy(it) + '<div class="refused"></div>';
  d.onclick = e => { if (e.target.classList.contains('mbtn')) return; openItem(it); };
  const mb = d.querySelector('.mbtn');
  if (mb) mb.onclick = async e => {
    e.stopPropagation();
    if (zoned) return mergeFrom(it, mb, it.reasons);
    if (!mb.classList.contains('confirm')) { mb.classList.add('confirm'); mb.textContent = 'Confirm merge'; setTimeout(() => { if (!mb.disabled) { mb.classList.remove('confirm'); mb.textContent = 'Merge'; } }, 4000); return; }
    return mergeFrom(it, mb);
  };
  return d;
}

function renderRail() {
  const rb = $('#railbody'); rb.innerHTML = '';
  const SECT = { security: '🔴 SECURITY', blocked: '🟠 BLOCKED — needs your decision', attention: '🔵 PRs NEEDING ATTENTION', mergeable: '🟢 READY TO MERGE' };
  const COL = { security: '#C2410C', blocked: '#B45309', attention: '#2F4AC0', mergeable: '#0F7A5C' };
  for (const sec of ['security', 'blocked', 'attention', 'mergeable']) {
    const items = STATE.rail[sec]; if (!items.length) continue;
    const h = document.createElement('div'); h.className = 'sect'; h.style.color = COL[sec]; h.textContent = SECT[sec];
    rb.appendChild(h);
    for (const it of items) rb.appendChild(railItem(it, sec));
  }
  if (!rb.children.length) rb.textContent = 'Nothing needs you. Rare — enjoy it.';
  if (STATE.hiddenPrs) {
    const more = document.createElement('div'); more.className = 'hidden-prs';
    more.textContent = STATE.hiddenPrs + ' more open PR(s) not analysed: only the newest 20 are read. Check them on GitHub.';
    rb.prepend(more);
  }
}

// Details card for a component: what it is, its files, what it uses and what uses it, owner-review
// zones, live health (Runtime lens data) and the flows that pass through it. All from the model.
function componentDetails(id) {
  const c = MODEL.components[id];
  const name = d => (MODEL.components[d] ? MODEL.components[d].name : d);
  const usedBy = Object.keys(MODEL.components).filter(k => (MODEL.components[k].deps || []).includes(id));
  const flows = Object.entries(MODEL.flows || {}).filter(([, f]) => JSON.stringify(f.steps || f).includes('"' + id + '"'));
  const chips = ids => ids.length ? ids.map(d => '<span class="chip" data-c="' + esc(d) + '">' + esc(name(d)) + '</span>').join('') : '<span class="cc">none</span>';
  const r = RUNTIME && RUNTIME.available && RUNTIME.components && RUNTIME.components[id];
  const el = document.createElement('div'); el.className = 'cdet';
  el.innerHTML = '<div>' + esc(c.description || '') + '</div>'
    + (c.provider ? '<h4>Provider</h4>' + esc(c.provider) : '')
    + '<h4>Health</h4>' + (r ? '<span class="st-' + esc(r.status) + '">● ' + esc(r.status) + '</span> · ' + esc(runtimeLine(r))
        : '<span class="cc">' + (RUNTIME && !RUNTIME.available ? 'runtime unavailable (' + esc(RUNTIME.reason) + ')' : 'no runtime signal for this component') + '</span>')
    + '<h4>Uses</h4>' + chips(c.deps || [])
    + '<h4>Used by</h4>' + chips(usedBy)
    + '<h4>Flows through it</h4>' + (flows.length ? flows.map(([k, f]) => esc(f.name || f.title || k)).join(' · ') : '<span class="cc">none</span>')
    + '<h4>Files</h4>' + (c.paths || []).map(g => '<code>' + esc(g) + '</code>').join(' ')
    + ((c.watch || []).length ? '<h4>Owner-review zones</h4>' + c.watch.map(g => '<code title="' + esc(g.note) + '">' + esc(g.pattern || g) + '</code>').join(' ') : '');
  el.querySelectorAll('.chip').forEach(ch => { ch.onclick = () => selectComponent(ch.dataset.c); });
  return el;
}

function selectComponent(id) {
  sel = { component: id, thread: null, pr: null, mode: 'list' };
  document.querySelectorAll('.node').forEach(n => n.classList.toggle('sel', n.id === 'n-' + id));
  const c = MODEL.components[id];
  $('#pcrumb').textContent = 'Component · ' + c.kind;
  $('#ptitle').textContent = c.name;
  const list = $('#plist'); list.style.display = 'block'; $('#thread').style.display = 'none';
  list.innerHTML = '';
  list.appendChild(componentDetails(id));
  const threads = STATE ? STATE.threads.filter(t => t.components.includes(id)) : [];
  const prs = STATE ? STATE.prs.filter(p => p.components.includes(id)) : [];
  for (const t of threads) {
    const r = document.createElement('div'); r.className = 'trow';
    r.innerHTML = '💬 <b>#' + esc(t.number) + '</b> ' + esc(t.title) + ' <span class="cc">· ' + esc(t.comments) + ' replies</span>';
    r.onclick = () => openIssue(t.number); list.appendChild(r);
  }
  for (const p of prs) {
    const r = document.createElement('div'); r.className = 'trow';
    r.innerHTML = '⇄ <b>PR #' + esc(p.number) + '</b> ' + esc(p.title) + (p.draft ? ' <span class="cc">· draft</span>' : '');
    r.onclick = () => openItem({ kind: 'pr', ...p }); list.appendChild(r);
  }
  const nb = document.createElement('button'); nb.className = 'ghost'; nb.textContent = '+ New thread on ' + c.name;
  nb.onclick = () => { sel.mode = 'new'; $('#pcrumb').textContent = 'New thread · first line becomes the title'; showComposer('Describe what you want the coding agent to look at on ' + c.name + '…'); };
  list.appendChild(nb);
  showComposer(null);
}

// "Ask:" selector — which agent(s) a message summons. Hidden with one agent; remembers the last choice.
const ASK_KEY = 'archwhere.ask';
function agents() { return (MODEL && MODEL.agents) || []; }
function renderAsk() {
  const list = agents(), s = $('#cask');
  if (list.length < 2) { $('#caskwrap').style.display = 'none'; return; }
  const opts = list.map(a => [a.name, a.name]).concat([['all', list.length === 2 ? 'Both' : 'All']]);
  s.innerHTML = '';
  for (const [v, label] of opts) { const o = document.createElement('option'); o.value = v; o.textContent = label; s.appendChild(o); }
  let saved = null; try { saved = localStorage.getItem(ASK_KEY); } catch { /* private mode */ }
  s.value = opts.some(([v]) => v === saved) ? saved : list[0].name;
  s.onchange = () => { try { localStorage.setItem(ASK_KEY, s.value); } catch { /* ignore */ } showComposer($('#cbody').dataset.ph || undefined); };
  $('#caskwrap').style.display = 'flex';
}
function askChoice() { return agents().length < 2 ? undefined : $('#cask').value; }
function askLabel() {
  const list = agents(); if (!list.length) return '';
  const c = askChoice();
  if (!c) return list[0].mention;
  return c === 'all' ? list.map(a => a.mention).join(' + ') : (list.find(a => a.name === c) || list[0]).mention;
}

function showComposer(placeholder) {
  const comp = $('#composer');
  if (placeholder === null && sel.mode === 'list') { comp.style.display = 'none'; return; }
  comp.style.display = 'flex';
  $('#cbody').dataset.ph = placeholder || '';
  const who = askLabel();
  $('#cbody').placeholder = (placeholder || 'Reply…') + (who ? ' (' + who + ' summoned unless you @mention one yourself)' : '');
}

let threadSig = '';
async function openIssue(number, opts = {}) {
  if (!opts.keep) { sel.thread = number; sel.pr = null; sel.mode = 'issue'; }
  const t = await j('/api/thread?number=' + number);
  // Replies arrive after a send (agents post "working…" and then edit it), so the open thread is
  // re-fetched on a timer; skip the re-render when nothing changed so scroll position is kept.
  const sig = JSON.stringify([t.body, t.comments.map(c => [c.user, c.at, c.body])]);
  if (opts.keep && sig === threadSig) return;
  threadSig = sig;
  if (!opts.keep) {
    $('#pcrumb').innerHTML = 'Thread · <a href="' + esc(t.url) + '" target="_blank" rel="noopener">#' + esc(number) + ' on GitHub</a>';
    $('#ptitle').textContent = t.title;
  }
  $('#plist').style.display = 'none';
  const th = $('#thread'); th.style.display = 'flex'; th.innerHTML = '';
  const add = (user, at, body, mine, agent) => {
    const m = document.createElement('div'); m.className = 'msg ' + (mine && !agent ? 'me' : 'them');
    m.innerHTML = '<div class="who"><b>' + esc(user) + '</b>' + (agent ? '<span class="agent">' + esc(agent) + '</span>' : '')
      + ' · ' + new Date(at || Date.now()).toLocaleString() + '</div>';
    m.appendChild(document.createTextNode(body || '')); th.appendChild(m);
  };
  add(t.user || 'owner', null, t.body, true);
  for (const c of t.comments) add(c.user, c.at, c.body, MODEL.viewer && c.user === MODEL.viewer, c.agent);
  th.scrollTop = th.scrollHeight;
  if (!opts.keep) showComposer('Reply on #' + number + '…');
}

async function openItem(it) {
  if (it.kind === 'issue') return openIssue(it.number);
  sel = { component: it.components[0] || null, thread: it.number, pr: it.number, mode: 'pr' };
  if (sel.component) document.querySelectorAll('.node').forEach(n => n.classList.toggle('sel', n.id === 'n-' + sel.component));
  await openIssue(it.number); // a PR's conversation is its issue thread (await: it sets the crumb too)
  sel.mode = 'pr';
  $('#pcrumb').innerHTML = 'Pull request · <a href="' + esc(it.url || it.html_url || '#') + '" target="_blank" rel="noopener">PR #' + esc(it.number) + '</a>'
    + (it.branch ? ' · ' + esc(it.branch) : '');
}

$('#csend').onclick = async () => {
  const body = $('#cbody').value.trim(); if (!body) return;
  $('#csend').disabled = true;
  try {
    if (sel.mode === 'new' && sel.component) {
      const lines = body.split('\n');
      const r = await j('/api/thread', { method: 'POST', body: JSON.stringify({ component: sel.component, title: lines[0].slice(0, 80), body, ask: askChoice() }) });
      await refreshState(); await openIssue(r.number);
    } else if (sel.thread) {
      await j('/api/comment', { method: 'POST', body: JSON.stringify({ number: sel.thread, body, ask: askChoice() }) });
      await openIssue(sel.thread);
    }
    $('#cbody').value = '';
  } catch (e) { alert('failed: ' + e.message); }
  $('#csend').disabled = false;
};

async function refreshState() {
  try {
    STATE = await j('/api/state');
    $('#meta').textContent = STATE.repo + ' · ' + new Date(STATE.generated).toLocaleTimeString() + (STATE.local.components.length ? ' · local edits: ' + STATE.local.components.join(', ') : '');
    renderRail(); renderBadges();
  } catch (e) { $('#meta').textContent = 'state error: ' + e.message; }
}

/** Errors always with their denominator, then the deploy: "red, and deployed 3 h ago" is a diagnosis. */
function runtimeLine(r) {
  const bits = [];
  for (const f of r.failures || []) {
    bits.push(f.name + (f.count != null ? ' ' + f.count.toLocaleString('en-GB') : '')
      + (f.window ? '/' + f.window : ''));
  }
  if (r.rate) bits.push('errors ' + r.rate);
  for (const l of r.lines || []) bits.push(l);
  if (r.deploy && r.deploy.ref) bits.push('deployed ' + r.deploy.ref + (r.deploy.at ? ' ' + ago(r.deploy.at) : ''));
  return bits.join(' · ');
}

/** "3 h ago" from an ISO stamp; the empty string when it is unparseable. */
function ago(iso) {
  const t = Date.parse(iso); if (!Number.isFinite(t)) return '';
  const m = Math.max(0, Math.round((Date.now() - t) / 60000));
  if (m < 60) return m + ' min ago';
  const h = Math.round(m / 60);
  return h < 48 ? h + ' h ago' : Math.round(h / 24) + ' d ago';
}

async function refreshRuntime() {
  try {
    RUNTIME = await j('/api/runtime');
    $('#rtnote').textContent = RUNTIME.available ? 'runtime from obs · refreshed ' + new Date().toLocaleTimeString() : 'Runtime unavailable: ' + RUNTIME.reason;
    for (const id of Object.keys(MODEL.components)) {
      const n = $('#n-' + id); if (!n) continue;
      n.classList.remove('h-ok', 'h-warn', 'h-bad');
      const r = RUNTIME.available && RUNTIME.components && RUNTIME.components[id];
      n.classList.remove('h-unknown');
      // No fallback to h-ok: an unrecognised or missing status is unknown, not healthy.
      // Falling through to green here is how a dead service looked fine for hours.
      const cls = r && { ok: 'h-ok', warn: 'h-warn', bad: 'h-bad', unknown: 'h-unknown' }[r.status];
      n.classList.add(cls || 'h-unknown');
      n.querySelector('.m').textContent = r ? runtimeLine(r) : 'no signal';
    }
  } catch (e) { $('#rtnote').textContent = 'runtime error: ' + e.message; }
}

let HEAT = null;
async function refreshHeat() {
  try {
    HEAT = await j('/api/heat?days=30');
    $('#heatnote').textContent = HEAT.error ? 'Heat unavailable: ' + HEAT.error
      : 'change heat · last ' + HEAT.days + ' days of git history · darker = more churn';
    for (const id of Object.keys(MODEL.components)) {
      const n = $('#n-' + id); if (!n) continue;
      const h = HEAT.components && HEAT.components[id];
      const m = n.querySelector('.m');
      if (h && HEAT.max) {
        const a = Math.sqrt(h.changes / HEAT.max);           // perceptual-ish ramp
        n.style.setProperty('--heat', 'rgba(215, 88, 38, ' + (0.08 + 0.55 * a).toFixed(2) + ')');
        m.textContent = '🔥 ' + h.changes + ' change' + (h.changes === 1 ? '' : 's') + ' · ' + h.files + ' file' + (h.files === 1 ? '' : 's');
      } else {
        n.style.setProperty('--heat', '#fff');
        m.textContent = 'quiet';
      }
    }
  } catch (e) { $('#heatnote').textContent = 'heat error: ' + e.message; }
}

(async function init() {
  MODEL = await j('/api/model');
  // The product name stays in both: the tab used to read "<system> — mission control" and the
  // heading "<system> — architecture mission control", so an install never said "archwhere" anywhere.
  document.title = MODEL.system + ' — archwhere mission control';
  document.querySelector('#htitle').textContent = MODEL.system + ' · mission control';
  renderMap();
  renderAsk();
  await refreshState();
  refreshRuntime(); // load health once so component details can show it
  setInterval(refreshState, 30000);
  // Keep the open conversation live: new and edited replies show without re-opening the thread.
  setInterval(() => {
    if (sel.thread && (sel.mode === 'issue' || sel.mode === 'pr') && !document.hidden) openIssue(sel.thread, { keep: true }).catch(() => {});
  }, 10000);
  setInterval(() => { if (metric() === 'health') refreshRuntime(); }, 30000);
})();
</script>
</body></html>
