# archwhere: comment every PR with the architecture components it touches.
name: archwhere
on:
  pull_request:
    # labeled/unlabeled: adding owner-review has to rerun the check.
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
  pull-requests: write
jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: tapaskar/archwhere@v1
        with:
          # Fails a stale map, a weakened map, or a security change without the owner-review label.
          enforce: true
